# Copy to config.toml and edit. Every value shown here is the built-in default,
# so you only need to keep the lines you change.

calibration = "calibration.json"

[camera]
# A /dev/video* path, a V4L2 index such as "0", "picamera", or an image/video file.
# The /dev/v4l/by-id/ path keeps pointing at the OBSBOT whatever else is plugged in.
source = "/dev/v4l/by-id/usb-Remo_Tech_Co.__Ltd._OBSBOT_Meet_2-video-index0"
width = 3840          # use 1296x972 with "picamera" (the Camera v1's full-field binned mode)
height = 2160
lock_after = 2.0      # seconds for exposure and white balance to settle; "picamera" then freezes
                      # them, USB cameras keep them automatic (0 = don't wait, never freeze)
fps = 30.0
focus = -1            # manual lens position, 0-100 on the OBSBOT; -1 = autofocus
zoom = -1             # 0 (widest) - 100 on the OBSBOT; -1 = leave the camera's setting alone

[vision]
work_width = 640        # frame is shrunk to this width to locate the body
strip_width = 320       # width of the straightened body crop
fg_threshold = 14.0     # raise if paper texture/shadows are detected as objects
shadow_weight = 0.5     # lower to ignore shadows and glare more (but grey parts too)
min_body_frac = 0.0005  # smallest body, as a fraction of the frame area
max_diameter_frac = 0.3   # thicker objects (hands etc.) are ignored
min_aspect = 1.4        # allowed body length / diameter
max_aspect = 8.0
band_threshold = 9.0    # lower to split bands that look alike, raise if one band splits in two
body_tolerance = 12.0   # raise if stretches of bare body are reported as bands
min_band_frac = 0.025   # narrowest band, as a fraction of body length
end_trim = 0.04         # ignored at each end of the body

[sorter]
window = 2.0          # seconds a resistor is watched; the readings over that time decide its bin
min_readings = 3      # trusted readings a decision needs (a Pi 4 gives 5-10 a second, a Pi 3 2-4)
min_agreement = 0.75  # share of those readings that must agree on the bin; raise for fewer wrong bins
reject_after = 6.0    # seconds without a decision before the resistor is rejected
clear_after = 0.5     # seconds with nothing in view before the next resistor is expected
min_margin = 4.0      # how clear-cut a single reading must be to count; raise for fewer wrong bins
max_color_distance = 15.0  # ignore readings where a band matches no calibrated colour this well

[servo]
enabled = "auto"      # "auto" drives the servo on a Raspberry Pi and leaves it alone elsewhere
                      # (a laptop); true / false force it on or off
pin = 17              # BCM numbering (physical pin 11); keep off GPIO 12 and 18, the hardware
                      # PWM pins the light's driver takes over
min_pulse_ms = 0.5    # an SG90's full travel; narrow towards 1.0 / 2.0 if the servo strains at +-90
max_pulse_ms = 2.4
reject_angle = 90.0   # where unreadable resistors go
settle = 0.5          # seconds to wait for the servo to arrive
mode = "chute"        # "chute": turn to the bin's angle and stay there until the next resistor
                      # "swing": turn there, wait `hold` seconds, turn back to `rest_angle`
rest_angle = 0.0      # ("swing" only) where the servo waits between resistors
hold = 1.0            # ("swing" only) seconds at the bin angle before turning back

[matrix]
enabled = "auto"      # an 8x8 LED matrix on a MAX7219 that shows each resistor's bin number; "auto"
                      # drives it on a Raspberry Pi with python3-spidev installed, true / false force it
bus = 0               # /dev/spidev<bus>.<device>: SPI0 with chip select CE0 (GPIO 8, physical pin 24)
device = 0
brightness = 4        # 0 (dimmest) to 15
rotate = 0            # 0, 90, 180 or 270 degrees clockwise, for however the module is mounted;
mirror = false        # also flip left to right (after rotating). `python3 -m resistor_sorter matrix`
                      # shows the signs so these can be checked
chain = 1             # MAX7219s daisy-chained on the module (4 on a "4-in-1"); only the first is used

[light]
enabled = "auto"      # WS2812 (NeoPixel) strips that light the resistor whenever the camera is in use;
                      # "auto" drives them on a Raspberry Pi with the neopixel library installed (see
                      # the README: it needs sudo), true / false force it
pins = [12, 21]       # BCM GPIO of each strip's data line (physical pins 32 and 40). The Pi can drive
                      # strips from GPIO 12 or 18 (PWM), 21 (PCM) and 10 (SPI)
leds = 8              # LEDs on each strip
brightness = 1.0      # 0 to 1
color = [255, 255, 255]  # red, green, blue, 0 to 255 each

[web]
enabled = true
host = "0.0.0.0"   # "127.0.0.1" to keep the preview off the network
port = 8000
max_fps = 15.0     # preview frame rate cap, to spare the CPU

# Bins are tried top to bottom; the first that accepts the value wins.
# Use min/max (ohms, min inclusive, max exclusive) or a list of exact values.
# A value no bin accepts goes to the reject position.
[[bin]]
name = "under 100 Ω"
max = 100
angle = -60

[[bin]]
name = "100 Ω – 1 kΩ"
min = 100
max = 1e3
angle = -30

[[bin]]
name = "1 kΩ – 10 kΩ"
min = 1e3
max = 1e4
angle = 0

[[bin]]
name = "10 kΩ – 100 kΩ"
min = 1e4
max = 1e5
angle = 30

[[bin]]
name = "100 kΩ and up"
min = 1e5
angle = 60

# Example of a bin for specific values:
# [[bin]]
# name = "pull-ups"
# values = [4700, 10000]
# angle = 45
